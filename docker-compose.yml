version: '3.8'

services:
  # 开发环境服务
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev.local  # 使用镜像ID版本，确保100%本地
    container_name: report-system-dev
    restart: always
    ports:
      - "3004:8000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/database:/app/public/database
      - ./public/local-storage:/app/public/local-storage
    environment:
      - NODE_ENV=development
      - VUE_APP_PREVIEW=true
      - VUE_APP_API_BASE_URL=https://test.faithindata.com.cn/stage-api
      - VUE_APP_ONLYOFFICE_HOST=192.168.3.10
      - ONLYOFFICE_HOST=192.168.3.10
      - VUE_APP_ONLYOFFICE_HTTP_PORT=8082
      - VUE_APP_INTERNAL_DOC_HOST=report-system-dev
      - VUE_APP_PUBLIC_HOST=192.168.3.10
      - VUE_APP_PUBLIC_PORT=3004
    networks:
      - report-network
    profiles:
      - dev

  # 生产环境服务
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: report-system-prod
    restart: always
    ports:
      - "3004:8000"
    volumes:
      - ./public/database:/app/public/database
      - ./public/local-storage:/app/public/local-storage
    environment:
      - NODE_ENV=production
      - VUE_APP_PREVIEW=true
      - VUE_APP_API_BASE_URL=https://test.faithindata.com.cn/stage-api
      - VUE_APP_ONLYOFFICE_HOST=192.168.3.10
      - ONLYOFFICE_HOST=192.168.3.10
      - VUE_APP_ONLYOFFICE_HTTP_PORT=8082
      - VUE_APP_INTERNAL_DOC_HOST=report-system-prod
      - VUE_APP_PUBLIC_HOST=192.168.3.10
      - VUE_APP_PUBLIC_PORT=3004
    networks:
      - report-network
    profiles:
      - prod

networks:
  report-network:
    driver: bridge
