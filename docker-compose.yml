version: '3.8'

services:
  # 开发环境服务
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: report-system-dev
    ports:
      - "3004:8000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/database:/app/public/database
      - ./local-storage:/app/public/local-storage
    environment:
      - NODE_ENV=development
      - VUE_APP_PREVIEW=true
      - VUE_APP_API_BASE_URL=https://test.faithindata.com.cn/stage-api
      - VUE_APP_ONLYOFFICE_HOST=${ONLYOFFICE_HOST:-127.0.0.1}
      - VUE_APP_ONLYOFFICE_HTTP_PORT=${ONLYOFFICE_HTTP_PORT:-8082}
      - VUE_APP_INTERNAL_DOC_HOST=report-system-dev
    networks:
      - report-network
    profiles:
      - dev

  # 生产环境服务
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: report-system-prod
    ports:
      - "3004:8000"
    volumes:
      - ./public/database:/app/public/database
    environment:
      - NODE_ENV=production
      - VUE_APP_PREVIEW=false
      - VUE_APP_API_BASE_URL=/stage-api
      - VUE_APP_ONLYOFFICE_HOST=${ONLYOFFICE_HOST:-127.0.0.1}
      - VUE_APP_ONLYOFFICE_HTTP_PORT=${ONLYOFFICE_HTTP_PORT:-8082}
      - VUE_APP_INTERNAL_DOC_HOST=report-system-prod
    networks:
      - report-network
    profiles:
      - prod

networks:
  report-network:
    driver: bridge
